name: umoja
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  supabase_flutter: ^2.17.2
  logging: ^1.3.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  http: ^1.2.0

# Prompt 05C §15-16 / 05E-C §11-13: native launcher icons, generated
# from the official flat Umoja symbol (umbrella + community mark only —
# never the wordmark, never a stacked/horizontal lockup, never a typed
# "U") via `dart run flutter_launcher_icons`. Only Android (the
# confirmed-broken, mandatory platform) and Web/PWA (low-risk,
# verifiable with `flutter build web` in this environment) are enabled
# — iOS/Windows/macOS are deliberately left untouched since their
# toolchains can't be built/verified here, and this tool's job is
# replacing icon assets, not something to run blind against platforms
# we can't check afterward.
#
# `assets/branding/icon/umoja_app_icon.png` is the one clear source of
# truth for the launcher icon — a plain copy of the approved flat
# `umoja_icon.png` mark (already in the exact Umoja brand red,
# `UmojaColors.primary` / #A51C30, transparent background, no
# gradient), kept as its own file specifically so this config always
# points somewhere unambiguous even if the runtime `umoja_icon.png`
# asset is ever re-cropped/re-exported. `app_icon_legacy.png` in the
# same directory is the *old*, wrong-red (~#F72F35) icon this replaces
# — kept only as an archival file, no longer referenced by this config
# or anywhere else, so it can't be picked up again by accident.
#
# `adaptive_icon_foreground_inset: 25` (up from Android's stock 20%)
# gives extra safe-area margin: this specific source image's opaque
# content already nearly fills its own canvas (~90-97%), so a larger
# inset is what actually keeps the umbrella/base clear of a circular or
# squircle launcher mask's crop, matching Android's ~66/108dp
# recommended safe-zone ratio more closely than the default would for
# this particular asset.
#
# Source images live in assets/branding/icon/ (not bundled into the app
# itself — these are launcher-icon-generation inputs, not runtime
# assets, so they are intentionally absent from `flutter: assets:`
# above).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path_android: "assets/branding/icon/umoja_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon/umoja_app_icon.png"
  adaptive_icon_foreground_inset: 25
  web:
    generate: true
    image_path: "assets/branding/icon/umoja_app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#A51C30"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml) —
  # Kiswahili (default) and English. See docs/product/design-system.md.
  generate: true

  # Official Umoja brand assets (see docs/product/design-system.md).
  # `umoja_mark.png` remains the authoritative source `flutter_launcher_icons`
  # reads (above) for native app-icon generation and is never edited in
  # place. `umoja_icon.png`/`umoja_wordmark.png`/`umoja_combined.png`/
  # `umoja_sidebar.png` are the current official on-screen artwork
  # (prompt 05F — supplied directly, replacing the earlier
  # manually-composed lockup). `_trim` variants are a runtime-only
  # derivative of each — cropped to its own opaque bounding box (plus a
  # few native pixels of safety margin) to remove baked-in transparent
  # canvas margin, never distorted/stretched, never cropping actual
  # glyph pixels. `UmojaBrandMark` renders only the `_trim` files.
  assets:
    - assets/branding/umoja_mark.png
    - assets/branding/umoja_icon.png
    - assets/branding/umoja_icon_trim.png
    - assets/branding/umoja_wordmark.png
    - assets/branding/umoja_wordmark_trim.png
    - assets/branding/umoja_combined.png
    - assets/branding/umoja_combined_trim.png
    - assets/branding/umoja_sidebar.png
    - assets/branding/umoja_sidebar_trim.png

  # Ubuntu is Umoja's application UI typeface (distinct from the brand
  # wordmark artwork above, which is never recreated with it). Bundled
  # as static font assets so there is no Google Fonts network
  # dependency at runtime.
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700
